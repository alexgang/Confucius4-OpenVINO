<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>EXT 延迟画面播放器</title>
  <style>
    html, body { margin: 0; background: #0d1117; color: #e6edf3; font: 12px/1.5 "Microsoft YaHei", system-ui, sans-serif; }
    #wrap { display: flex; flex-direction: column; align-items: center; padding: 8px; gap: 8px; }
    canvas { width: 96vw; height: 80vh; object-fit: contain; background: #000; border-radius: 6px; }
    #wrap { padding-top: 4px; }
    #bar { display: flex; flex-wrap: wrap; gap: 14px; padding: 4px 10px; background: #161b22; border-radius: 6px; font-variant-numeric: tabular-nums; }
    body { padding-bottom: 76px; }
    #stage { position: relative; width: 96vw; height: calc(100vh - 210px); min-height: 240px; }
    #stage canvas { width: 100%; height: 100%; }
    #subs { position: fixed; left: 0; right: 0; bottom: 0; height: 72px; box-sizing: border-box;
            padding: 6px 12px; text-align: center; font-size: 20px; line-height: 1.35; overflow: hidden;
            background: #010409; border-top: 1px solid #30363d; pointer-events: none; z-index: 10; }
    #subs span { padding: 0 8px; }
    #subs span.src { font-size: 14px; color: #8b949e; }
    .k { color: #8b949e; }
    /* ★ EXT-024 E：常驻链路状态条 */
    #linkBar { display: block; width: 100%; padding: 3px 10px; background: #161b22; border-radius: 6px; font-variant-numeric: tabular-nums; }
    #linkBar.ok { color: #3fb950; }
    #linkBar.err { color: #d29922; }
    #linkReason { display: none; width: 100%; padding: 3px 10px; border-radius: 6px; font-weight: 700; }
    #linkReason.err { color: #f85149; }
    #linkReason.ok { color: #3fb950; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="stage"><canvas id="cv" width="640" height="360"></canvas></div>
    <div style="margin:4px 0"><button id="btnCapture" style="display:none;padding:6px 16px;font:inherit">开始捕获（选择要配音的标签页）</button>
      <!-- ★★★ EXT-026 修正：停止时必须让服务端**收口尾段**
           （否则最后一句永远不会被翻译/配音）。 -->
      <button id="btnFlush" style="display:none;padding:6px 16px;font:inherit">停止并收尾（跑完最后一句）</button>
    </div>
    <div id="bar">
      <span><span class="k">队列</span> <b id="mQueue">0</b></span>
      <span><span class="k">编码</span> <b id="mEnc">0</b></span>
      <span><span class="k">解码</span> <b id="mDec">0</b></span>
      <span><span class="k">绘制</span> <b id="mDraw">0</b></span>
      <span><span class="k">掉帧</span> <b id="mDrop">0</b></span>
      <span><span class="k">编码器</span> <b id="mCodec">—</b></span>
      <span><span class="k">延迟</span> <b id="mDelay">0</b> s</span>
      <span><span class="k">唇音误差</span> <b id="mLip">—</b> ms</span>
      <span><span class="k">排程误差</span> <b id="mSched">—</b> ms</span>
      <span><span class="k" title="运算那台电脑的 Intel 集显占用（整机）">iGPU</span> <b id="mIgpu">—</b> %</span>
      <span><span class="k" title="运算那台电脑的 NPU 占用（整机）">NPU</span> <b id="mNpu">—</b> %</span>
      <span><span class="k" title="桥接进程（运算那台电脑）的内存占用">桥接内存</span> <b id="mMem">—</b> MB</span>
      <!-- ★ EXT-009：底栏显示当前语速倍率与滞后秒数 -->
      <span><span class="k">语速</span> <b id="mSpeed">1.00</b>×</span>
      <span><span class="k">滞后</span> <b id="mLag">0.0</b> s</span>
      <span><span class="k">滞后峰值</span> <b id="mLagPeak">0.0</b> s</span>
      <span><span class="k">配音输出</span> <b id="mSink">—</b></span>
    </div>
    <!-- ★ EXT-024 E：链路状态条（常驻显示 5 个计数 + 当前滞后；卡住时红字写原因） -->
    <div id="linkBar" class="ok">音频 0.0s | ASR 0 | MT 0 | TTS 0 | 下发 0 | 滞后 —</div>
    <div id="linkReason" class="ok"></div>
  </div>
  <div id="subs"></div>
  <script src="player.js"></script>
</body>
</html>
